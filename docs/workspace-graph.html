ters", "type": "untyped", "description": "", "tags": [], "size": 16, "resource": "../graft/server-services.md", "color": "#1d4ed8"}}, {"data": {"id": "graft/tests-suite", "label": "Automated Test Suite (Bun Unit/Integration + Playwright E2E)", "type": "untyped", "description": "", "tags": [], "size": 16, "resource": "../graft/tests-suite.md", "color": "#1d4ed8"}}, {"data": {"id": "graphify-out/GRAPH_REPORT", "label": "Graph Report - insta-auto-panel  (2026-11-10)", "type": "untyped", "description": "", "tags": [], "size": 16, "resource": "../graphify-out/GRAPH_REPORT.md", "color": "#1d4ed8"}}], "bodies": {"README": "# Social Panel (insta-auto-panel)\n\n> Painel web moderno, autônomo e de alta performance para planejamento editorial, geração assistida por IA agnóstica (ML Studio API, Gemini, OpenAI, Claude), Studio Visual OpenDesign 4:5 (1080×1350px) nativo sem Canva, checklist Instagram SEO (Framework MATCH 2026), exportação Canva Pro e enfileiramento autônomo multi-tenant no motor de publicação **`Katzca/AutoSocial`**.\n\n---\n\n## 🚀 Arquitetura & Stack Tecnológica\n\n- **Runtime & Package Manager:** [Bun v1.4+](https://bun.com)\n- **Frontend SPA:** [Vite](https://vitejs.dev) + [React 19](https://react.dev) + TypeScript\n- **Estilização & Design System:** [Tailwind CSS v4](https://tailwindcss.com) + [shadcn/ui](https://ui.shadcn.com) + Lucide Icons + Sidebar colapsável moderna.\n- **Banco de Dados Relacional:** SQLite ACID com [`bun:sqlite`](https://bun.com/docs/api/sqlite) e [Drizzle ORM](https://orm.drizzle.team) operando em modo **WAL (Write-Ahead Logging)** com `foreign_keys = ON`.\n- **Arquitetura em Camadas (Clean Architecture):**\n  - **Domínio & Serviços:** `src/server/services/schedules/schedule-service.ts` (gerenciamento de semanas e slides), `src/server/services/instagram/cookies.ts` (parser de cookies do Instagram), `src/server/services/design/` (templates e provedores de imagem), `src/server/services/export/autosocial.ts` (enfileiramento com isolamento estrito de fotos).\n  - **Rotas & Controladores:** `src/server/routes/` enxutos, focados na camada de transporte HTTP e validação com Zod schemas.\n  - **Hooks Reativos:** `src/client/hooks/useWeekSchedule.ts` desacoplando regras de estado do cronograma da camada de visualização.\n- **Inteligência Artificial Agnóstica:**\n  - **ML Studio API / LM Studio** local (`http://localhost:1234/v1`)\n  - Google Gemini (`gemini-2.5-flash` / Pro)\n  - OpenAI (`gpt-4o` / `gpt-4o-mini`)\n  - Anthropic Claude (`claude-3-5-sonnet`)\n  - Groq (`llama-3.3-70b`) e Ollama local\n  - **Instagram SEO 2026 (Framework MATCH):** Alt text gerado para acessibilidade, cluster de palavras-chave, abertura indexável e legenda otimizada com 3 a 5 hashtags sem URLs cruas.\n- **Studio Visual OpenDesign 4:5:**\n  - Renderizador nativo de carrosséis 4:5 (1080×1350px) com múltiplos temas visuais (Editorial Bold, Clean Minimal, Dark Tech, Modern Gradient).\n  - Provedores de imagem: OpenAI DALL-E, OpenRouter, Gemini Imagen e SVG Local de fallback offline.\n- **Publicação Autônoma AutoSocial:**\n  - Fila estrita e isolada por tenant (`data/autosocial/queue/<company_id>/instagram/pending/`) com sidecars `.description`, mídias numeradas e horário programado.\n- **Segurança Defensiva:**\n  - Injeção global de headers (`nosniff`, `SAMEORIGIN`, `strict-origin-when-cross-origin`, `Permissions-Policy`).\n  - Proteção estrita contra Path Traversal em uploads e renders.\n- **Garantia de Qualidade:**\n  - 92 testes unitários herméticos com Bun Test (`bun test`).\n  - Verificação de tipos TypeScript sem erros (`bun x tsc --noEmit`).\n\n---\n\n## 📋 Funcionalidades Principais\n\n1. **Gestão Multi-Empresa & Brand Kit Isolado:**\n   - Troca instantânea de tenant no topo via `CompanySwitcher`.\n   - Brand Kit com 4 cores da marca (Primária, Secundária, Fundo, Destaque), nicho, redes sociais e tipografia.\n   - Isolamento atômico estrito: fotos, posts, cronogramas, cookies e configurações são 100% particionados por empresa.\n2. **Acervo de Fotos Base da Marca:**\n   - Upload com validação de imagem e categorização de nicho (`Especialista`, `Produto`, `Logo`, `Fundo`).\n   - Servidor estático seguro (`/uploads/*`) com proteção de isolamento de tenant.\n3. **Planejador Semanal com Separação por Horário:**\n   - Grade semanal de 7 dias com auto-inicialização e navegação de semanas.\n   - Definição do horário agendado com badge de período (Manhã, Tarde, Noite).\n   - Botão direto para abrir o post selecionado no Studio Visual 4:5.\n4. **Studio Visual OpenDesign 4:5:**\n   - Edição e visualização em tempo real de carrosséis de 3 a 10 lâminas.\n   - Alternância de templates visuais responsivos às cores do Brand Kit.\n   - Geração de imagens via IA ou backgrounds SVG sem dependência externa.\n5. **Hub Central de Configurações (`SettingsHub`):**\n   - Cookies de sessão do Instagram por empresa com parser universal (EditThisCookie, Cookie-Editor, Playwright storageState, Netscape).\n   - Seleção e teste de provedores de imagem e templates visuais padrão.\n6. **Fila de Publicação AutoSocial:**\n   - Enfileiramento direto com sidecar `.description` contendo legenda e horário.\n   - Monitor em tempo real de itens Pendentes, Publicados e Falhas no disco.\n\n---\n\n## 🛠️ Execução e Testes\n\n### Instalação\n```bash\ngit clone git@github.com:eduardorwll/insta-auto-panel.git\ncd insta-auto-panel\nbun install\n```\n\n### Iniciar o Servidor\n```bash\nPORT=3000 bun run src/server/index.ts\n```\nAcesse no navegador: `http://localhost:3000`\n\n### Executar Testes Unitários\n```bash\nbun test\n```\n\n### Checagem de Tipos TypeScript\n```bash\nbun x tsc --noEmit\n```\n", "docs/CONTEXT": "# docs/ — Estante de Documentação & Conhecimento do Sistema\n\nContém as especificações, planos de marcos, arquitetura de máquinas de estado, padrões de engenharia e guias humanos do **Social Panel**.\n\n## Mapa da Estante\n\n| Prateleira | Conteúdo | Contrato / Arquivo |\n| :--- | :--- | :--- |\n| [`architecture/`](/docs/architecture/invisiveis-e-maquinas-de-estado.md) | Catálogo de FSMs e 16 bugs arquiteturais | `invisiveis-e-maquinas-de-estado.md` |\n| [`specs/`](/docs/specs/requisitos-planejamento.md) | PRD mestre e relatório de engenharia | `requisitos-planejamento.md`, `relatorio-engenharia-negocio.md` |\n| [`plans/`](/docs/plans/checklist-marcos-m8-a-m15.md) | Checklists de marcos e fluxo de testes Vite | `checklist-marcos-m8-a-m15.md`, `fluxo-desenvolvimento-e-testes.md` |\n| [`standards/`](/docs/standards/multi-agent-contracts.md) | Padrões de engenharia, UI/UX, TDD e SEO | `multi-agent-contracts.md`, `ui-ux-craft.md`, `tdd-refactoring.md`, `instagram-seo.md` |\n| [`guides/`](/docs/guides/estudo-arquitetura-invisivel.md) | Guia didático para humanos dos 7 livros | `estudo-arquitetura-invisivel.md` |\n\n## Regra de Edição\n- Nenhum documento nesta pasta carrega estado em duplicata.\n- Links e caminhos são relativos e auditados por `python3 _tools/links.py`.\n", "docs/architecture/invisiveis-e-maquinas-de-estado": "# 🏛️ Guia Permanente de Arquitetura: Problemas \"Invisíveis\", Máquinas de Estado Explícitas & Invariantes de Domínio\n\n> **Propósito:** Documento vivo de aprendizado permanente para engenheiros humanos e agentes de IA que atuam no **Social Panel (`insta-auto-panel`)**.  \n> **Guia Didático Complementar para Humanos:** [`../guides/estudo-arquitetura-invisivel.md`](/docs/guides/estudo-arquitetura-invisivel.md) (leitura didática dos 7 livros, exercícios práticos e lentes mentais).  \n> **Regra Vinculada:** [AGENTS.md](../AGENTS.md) e [Multi-Agent Contracts](/docs/standards/multi-agent-contracts.md).\n\n---\n\n## 1. O Que São Problemas Arquiteturais \"Invisíveis\"?\n\nProblemas arquiteturais invisíveis são falhas estruturais onde **100% dos testes unitários de caminho feliz passam**, o compilador não aponta erros de sintaxe, mas o sistema entra em **estados contraditórios, perde dados silenciosamente ou degrada ao longo do tempo** devido a:\n1. **Máquinas de Estado Implícitas (*Boolean Soup* & Strings Livres):** Múltiplas flags booleanas independentes (`isLoading`, `isSaving`, `isRendering`, `isGeneratingAI`) ou colunas `status` alteradas sem tabela formal de transições e pré-condições (*guards*).\n2. **Acoplamento Temporal (*Temporal Coupling*):** O sucesso de uma operação depende de o chamador executar passos na ordem exata ou dentro de uma janela de tempo sem garantias atômicas.\n3. **Fontes da Verdade Duplicadas (*Split-Brain / Dual-Write Drift*):** O mesmo estado reside simultaneamente no SQLite, no sistema de arquivos (`data/autosocial/queue/`) e em múltiplos `useState` do React sem reconciliação transacional.\n4. **Falhas Parciais Não-Transacionais (*Partial Failure States*):** Loops de `INSERT`/`UPDATE` fora de `db.transaction()` ou gravações em disco sem compensação (*rollback*) quando o banco falha.\n\n---\n\n## 2. Catálogo das 7 Máquinas de Estado Implícitas Identificadas na Codebase\n\n| # | Máquina de Estado | Onde Estava Implícita | Sintoma / Bug Real | Solução Arquitetural Canônica |\n| :-: | :--- | :--- | :--- | :--- |\n| **1** | **Ciclo de Vida Editorial do Post (`PostStatus`)** | [`schema.ts#L30-L38`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/db/schema.ts#L30-L38), [`schedules.ts#L28`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/schedules.ts#L28), [`useWeekSchedule.ts#L77`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/hooks/useWeekSchedule.ts#L77), [`PublicationQueue.tsx#L37`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/PublicationQueue.tsx#L37) | Divergência `\"published\"` (schema) vs `\"posted\"` (rotas e UI), falta do estado `\"failed\"` e mutações diretas sem validar pré-condições. | FSM pura `post-lifecycle.machine.ts` com estados `draft -> ai_generated -> ready_design -> queued -> published \\| failed` e função `transitionPostStatus()`. |\n| **2** | **Fila Física AutoSocial vs. SQLite** | [`autosocial.ts#L41-L167`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/export/autosocial.ts#L41-L167), [`PublicationQueue.tsx#L83-L165`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/PublicationQueue.tsx#L83-L165) | Quando o worker move arquivos de `pending/` para `published/` ou `failed/`, o SQLite permanece preso em `queued`; cliques duplos geram arquivos duplicados em `pending/`. | Enfileiramento **idempotente por `postId`** + reconciliador automático `reconcileAutoSocialQueueWithDb(companyId)` ao consultar a fila/cronograma. |\n| **3** | **Workflow Assíncrono do Studio Visual (*Boolean Soup*)** | [`DesignStudioTab.tsx#L159-L178`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/DesignStudioTab.tsx#L159-L178) e [`L372-L547`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/DesignStudioTab.tsx#L372-L547) | 7 booleans independentes permitem condições de corrida ao trocar de dia (`selectedDayIndex`) enquanto uma geração de IA está em voo. | Redutor determinístico `useStudioWorkflowMachine` (`idle \\| saving \\| generating_ai \\| generating_bg \\| rendering \\| error`) com token de versão/postId. |\n| **4** | **Boot & Sessão de Autenticação do Home Server** | [`App.tsx#L272-L315`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/App.tsx#L272-L315), [`session.ts#L15-L138`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/auth/session.ts#L15-L138) | Booleano `isLocked` monta `<CompanyProvider>` antes de `/api/auth/me` responder, gerando rajadas `401` no primeiro render se o cookie expirou. | FSM explícita `'bootstrapping' \\| 'authenticated' \\| 'unauthenticated'` antes de montar os provedores autenticados. |\n| **5** | **Saúde & Expiração dos Cookies Instagram** | [`schema.ts#L329`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/db/schema.ts#L329), [`settings.ts#L190-L265`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/settings.ts#L190-L265) | O estado `'expired'` nunca era ativado mesmo quando o timestamp `expires` do `sessionid` já havia vencido ou o arquivo `cookies.json` não existia. | Validador determinístico `evaluateInstagramSessionState()` inspecionando existência física e `expires` real do cookie. |\n| **6** | **Modo Operacional & Fallback de Provedores IA** | [`quota-guard.ts#L102-L162`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/ai/quota-guard.ts#L102-L162), [`design.ts#L90-L135`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/design.ts#L90-L135) | Condicionais booleanas aninhadas misturam falta de chave, estouro de orçamento e falha de rede sem estado explícito de degradação. | Estado explícito `executionMode`: `'live_api' \\| 'quota_svg_fallback' \\| 'missing_key_svg_fallback' \\| 'upstream_error_svg_fallback' \\| 'blocked_hard_quota'`. |\n| **7** | **Ciclo de Edição de Formulários (*Dirty State*)** | [`CompanyTab.tsx#L79-L155`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/CompanyTab.tsx#L79-L155), [`DesignStudioTab.tsx#L319-L410`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/DesignStudioTab.tsx#L319-L410) | Edições não salvas (`dirty`) são descartadas silenciosamente ao trocar de aba/empresa, e timers `setTimeout` não são limpos no unmount. | Estados explícitos `'clean' \\| 'dirty' \\| 'saving' \\| 'saved' \\| 'error'` + guarda de navegação e unificação atômica do salvamento. |\n\n---\n\n## 3. Catálogo dos 16 Problemas Arquiteturais \"Invisíveis\" Encontrados no Código\n\n### Categoria A — Atomicidade, Transações & Consistência de Dados (ACID vs. Disco)\n1. **Escrita Multi-Tabela Sem Transação (`Non-Atomic Multi-Step Write`):** Loops de `INSERT`/`UPDATE` fora de `db.transaction()` em [`schedule-service.ts#L84-L114`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/schedules/schedule-service.ts#L84-L114), [`schedule-service.ts#L207-L227`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/schedules/schedule-service.ts#L207-L227) e [`ai.ts#L433-L481`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/ai.ts#L433-L481).\n2. **Dual-Write Não-Transacional entre Disco e SQLite (`Dual-Write Drift`):** Gravação de arquivos em disco sem compensação/rollback caso o SQLite falhe em [`photos.ts#L111-L132`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/photos.ts#L111-L132), [`design.ts#L233-L259`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/design.ts#L233-L259) e [`autosocial.ts#L60-L118`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/export/autosocial.ts#L60-L118).\n3. **Vazamento de Arquivos Órfãos em Disco no `ON DELETE CASCADE` (`Storage Garbage Leak`):** Exclusão de empresas/posts em [`companies.ts#L130-L138`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/companies.ts#L130-L138) e [`schedule-service.ts#L326-L336`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/schedules/schedule-service.ts#L326-L336) sem remover diretórios físicos em `data/uploads/`, `data/renders/` e `data/autosocial/`.\n4. **Lâminas Fantasmas quando a IA Reduz `slideCount` (`Stale Child Records on Resize`):** Em [`ai.ts#L447-L481`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/ai.ts#L447-L481), reduzir um post de 7 para 4 lâminas atualiza `1..4` mas deixa `5..7` antigas vivas no banco.\n\n### Categoria B — Acoplamento Temporal & Condições de Corrida Cliente-Servidor\n5. **Perda Silenciosa de Texto em Novas Lâminas no \"Salvar\" (`Split-Request Save & Temp-ID Bug`):** [`DesignStudioTab.tsx#L337-L400`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/DesignStudioTab.tsx#L337-L400) cria lâminas com `id: \"temp_slide_...\"` e faz dois `PUT` seguidos; o segundo `PUT /api/posts/:id/slides` tenta atualizar pelo `temp_slide_...` (que não existe no banco) ou falha em casar por `(postId, slideNumber)`.\n6. **Corrida `Check-Then-Act` (TOCTOU) na Criação Automática da Semana:** Duas chamadas simultâneas a [`getOrCreateWeeklySchedule` (`schedule-service.ts#L72-L88`)](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/schedules/schedule-service.ts#L72-L88) tentam inserir o mesmo `scheduleId` sem `onConflictDoNothing()`.\n7. **Descompasso de Fuso Horário (`UTC` vs `Local Time`) na Função Triplicada `getMonday()`:** Triplicada em [`useWeekSchedule.ts#L9-L15`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/hooks/useWeekSchedule.ts#L9-L15), [`DesignStudioTab.tsx#L130-L136`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/DesignStudioTab.tsx#L130-L136) e [`PublicationQueue.tsx#L40-L46`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/PublicationQueue.tsx#L40-L46), misturando `getDate()` local com `toISOString()` UTC.\n\n### Categoria C — Fontes da Verdade Duplicadas (*Split-Brain Architecture*)\n8. **Três Estados Independentes de Semana/Posts entre as Abas (`Disconnected Client State`):** `WeekPlanner`, `DesignStudioTab` e `PublicationQueue` não compartilham `weekStartDate`.\n9. **Divergência entre o Motor de Preview (Canvas 2D) e o Motor de Exportação (PNG Server-Side):** [`DesignStudioTab.tsx#L511-L520`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/client/components/DesignStudioTab.tsx#L511-L520) não envia o snapshot do Canvas ou não compartilha o mesmo pipeline de renderização de alta resolução.\n10. **Triplicação de Definição de Schema (`Schema Drift`):** Enums e tabelas redefinidos separadamente em `schema.ts`, `schedules.ts`, `client.ts` e testes.\n\n### Categoria D — Integridade Referencial, Segurança Multi-Tenant & Observabilidade\n11. **Referências Fantasmas em Colunas JSON Desnormalizadas (`Dangling IDs in JSON Columns`):** `DELETE /api/photos/:id` ([`photos.ts#L136-L155`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/photos.ts#L136-L155)) não remove o ID excluído do array JSON `posts.selected_photo_ids`.\n12. **Mutação de Lâminas por ID sem Escopo Composto `(postId, slideNumber)`:** [`updatePostSlidesContent` (`schedule-service.ts#L260-L278`)](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/schedules/schedule-service.ts#L260-L278) faz `WHERE id = item.id` sem filtrar por `post_id = postId`.\n13. **Invariante de Domínio Morta (`photo_assets.timesUsed`):** Contador de uso de fotos nunca é incrementado/atualizado quando fotos são vinculadas ou enfileiradas.\n14. **Acoplamento ao Singleton Global `db`:** Dificulta a injeção de conexões `:memory:` isoladas em testes de integração.\n15. **Crescimento Ilimitado de `Map` em Memória nos Rate-Limiters (`Unbounded Memory Growth`):** `loginAttempts` ([`session.ts#L15`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/auth/session.ts#L15)) e `rpmBuckets` ([`quota-guard.ts#L13`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/ai/quota-guard.ts#L13)) sem `eviction` periódico nem limite máximo de chaves.\n16. **Blocos `catch {}` Vazios Ocultando Erros Estruturais:** [`db/client.ts#L42 e #L95`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/db/client.ts#L42-L95) ignoram falhas inesperadas sem diferenciar `duplicate column name` de erros reais.\n\n---\n\n## 4. Bibliografia de Referência & Lentes Mentais de Engenharia\n\n1. ***Domain Modeling Made Functional* — Scott Wlaschin:** *Make Illegal States Unrepresentable* com tipos algébricos (unions discriminadas) e máquinas de estado explícitas no sistema de tipos.\n2. ***Constructing the User Interface with Statecharts* — Ian Horrocks:** Substituição de flags booleanas espalhadas em UIs por Statecharts determinísticos.\n3. ***Designing Data-Intensive Applications (DDIA)* — Martin Kleppmann:** Fontes únicas da verdade, transações ACID, prevenção de *Dual-Write Drift* e condições de corrida (*TOCTOU*).\n4. ***A Philosophy of Software Design* — John Ousterhout:** Redução de carga cognitiva, eliminação de acoplamento temporal e *Design Errors Out of Existence*.\n5. ***Release It! (2ª Edição)* — Michael T. Nygard:** Estabilidade em produção, limites em coleções em memória (*Bounded Maps*), limpeza de recursos em disco e degradação graciosa explícita.\n6. ***Secure by Design* — Dan Bergh Johnsson, Daniel Deogun & Daniel Sawano:** Invariantes de segurança e escopo multi-tenant embutidos diretamente nas queries e contratos de domínio.\n7. ***Software Architecture: The Hard Parts* — Neal Ford et al.:** Coordenação transacional entre banco relacional, sistema de arquivos e provedores externos.\n\n---\n\n## 5. Os 10 Mandamentos de Auditoria Anti-Bugs Invisíveis (Checklist Permanente)\n\nAntes de dar qualquer novo recurso ou refatoração por concluído neste repositório, todo agente deve validar estas **10 Invariantes**:\n\n1. **Zero *Boolean Soup*:** Nenhum componente ou serviço pode ter mais de 1 flag booleana para representar etapas do mesmo fluxo; use sempre uma união discriminada (`status: 'idle' | 'loading' | 'saving' | 'error'`).\n2. **Transições de Estado com Guarda Explícita:** Nenhuma coluna `status` no banco pode ser alterada sem passar pela máquina de estados correspondente em `src/shared/state-machines/`.\n3. **Transações ACID Obrigatórias em Mutações Multi-Passo:** Toda função que executa mais de um `INSERT`/`UPDATE`/`DELETE` no SQLite deve rodar dentro de `db.transaction()` (ou transação síncrona do `bun:sqlite`).\n4. **Idempotência e Reconciliação Banco ↔ Disco:** Toda gravação na fila do AutoSocial deve ser idempotente por `postId` e reconciliar estados físicos (`pending/`, `published/`, `failed/`) com o SQLite.\n5. **Chave Natural Composta `(postId, slideNumber)` para Lâminas:** Nunca depender de IDs temporários gerados no frontend (`temp_slide_...`); atualizar e sincronizar lâminas sempre pelo par `(postId, slideNumber)` e podar lâminas excedentes (`slideNumber > slideCount`).\n6. **Limpeza Física Simétrica ao `ON DELETE CASCADE`:** Excluir um post, foto ou empresa no SQLite deve remover simetricamente seus artefatos físicos em disco (`uploads`, `renders`, `queue`).\n7. **Datas Locais Puras sem Mistura `UTC` (`YYYY-MM-DD`):** Operações de calendário (`getMonday`, `addDays`) devem residir em um único utilitário canônico (`src/shared/calendar-dates.ts`) operando puramente em componentes locais (`getFullYear`, `getMonth`, `getDate`), nunca misturando `getDate()` com `toISOString()`.\n8. **Escopo Composto em Queries de Filhos:** Todo `UPDATE` ou `DELETE` em tabela filha (`post_slides`, `photo_assets`, `company_post_types`) deve incluir na cláusula `WHERE` o vínculo com o pai/tenant (`postId` / `companyId`).\n9. **Coleções em Memória com Teto (`Bounded Maps`):** Todo cache ou rate-limiter em memória deve ter `MAX_ENTRIES` e poda automática de chaves expiradas.\n10. **Proibição de `catch {}` Cego em Migrações:** Só ignorar silenciosamente erros esperados e verificados (ex.: `/duplicate column name/i`), registrando qualquer outro erro estrutural.\n", "docs/guides/estudo-arquitetura-invisivel": "# 📖 Guia de Estudo: Como Enxergar Problemas de Arquitetura \"Invisíveis\"\n\n> **Para quem é:** você (humano), para ler com calma e aprender a *ver* esta classe de bug em qualquer projeto.\n> **Base:** o que foi encontrado e corrigido no Social Panel nos Marcos M12–M15, ligado aos 7 livros indicados.\n> **Companheiro de consulta rápida (para agentes):** [`../architecture/invisiveis-e-maquinas-de-estado.md`](/docs/architecture/invisiveis-e-maquinas-de-estado.md) e [AGENTS.md](../AGENTS.md).\n\n> [!NOTE]\n> **Sobre as referências aos livros:** eu citei conceitos e padrões pelo nome, que é o que dá para buscar no índice. **Não** coloquei números de capítulo nem páginas, porque não tenho como conferir a sua edição. Procure pelo termo no sumário ou índice do livro.\n\n---\n\n## Parte 1 — A ideia central em 5 minutos\n\nUm bug \"invisível\" é um bug que **nenhum teste de caminho feliz pega**. O código compila, a tela funciona na demonstração, e mesmo assim o sistema fica errado em algum momento: dados somem, estados se contradizem, a memória cresce. Quase sempre a causa é uma destas cinco:\n\n| # | Causa-raiz | Pergunta que revela o problema |\n| :-: | :--- | :--- |\n| 1 | **Máquina de estado implícita**: o estado existe, mas ninguém o desenhou | \"Quais valores esse campo pode ter, e de qual para qual ele pode ir?\" |\n| 2 | **Escrita parcial**: várias escritas que deveriam ser uma só | \"Se o processo cair entre a linha 3 e a linha 4, o que fica no banco?\" |\n| 3 | **Duas fontes da verdade**: banco, disco e tela guardam a mesma coisa | \"Se eu mudar um, quem avisa os outros?\" |\n| 4 | **Corrida (concorrência)**: duas coisas acontecem \"ao mesmo tempo\" | \"E se o usuário clicar duas vezes? E se trocar de aba no meio?\" |\n| 5 | **Recurso sem teto**: cresce para sempre | \"O que limita o tamanho disso depois de 6 meses ligado?\" |\n\nO hábito que resolve tudo: **parar de testar o que o código faz e começar a perguntar o que ele permite que aconteça.**\n\n---\n\n## Parte 2 — Os cinco padrões, com o caso real de cada um\n\n### 2.1 Máquina de estado implícita (e \"sopa de booleans\")\n\n**O que é.** Quando um fluxo tem etapas (ocioso → salvando → pronto), cada etapa vira uma variável `true/false` separada. Com 7 booleans existem 128 combinações, e só umas 8 fazem sentido. As outras 120 são estados impossíveis que o código não impede.\n\n**Caso real (Social Panel).** O `DesignStudioTab` tinha 7 booleans (`isRendering`, `isGeneratingBg`, `isGeneratingAI`, `isSaving`, `saveSuccess`, `isAddingPost`, `isDeletingPost`). Era possível gerar com IA e renderizar ao mesmo tempo, e se você trocava de dia no meio, a resposta da IA caía **no post errado** (a lista era atualizada por índice, não por id).\n\n**Segundo caso, ainda mais sutil.** A coluna `posts.status` usava `\"published\"` no schema e `\"posted\"` na interface. Nenhum erro de compilação, porque era só uma string. O estado `\"failed\"` nem existia.\n\n**A cura.** Desenhar a tabela de transições e fazer o código recusar o que não está nela:\n- [`post-lifecycle.machine.ts`](../src/shared/state-machines/post-lifecycle.machine.ts): `draft → ai_generated → ready_design → queued → published | failed`. Tentar `draft → published` lança erro (a rota devolve **409**).\n- [`studio-workflow.machine.ts`](../src/shared/state-machines/studio-workflow.machine.ts): uma operação por vez; `FINISH` só vale se for da mesma operação.\n- [`auth-boot.machine.ts`](../src/shared/state-machines/auth-boot.machine.ts): `bootstrapping | authenticated | unauthenticated` no lugar de um `isLocked` que mentia durante o carregamento.\n\n**Como treinar o olho.** Quando você vir dois ou mais `useState<boolean>` no mesmo componente, ou uma coluna `status` do tipo texto, pergunte: *\"qual é o diagrama de estados disso?\"* Se você não consegue desenhar, ele é implícito.\n\n📚 **Onde aprofundar**\n- **Wlaschin, *Domain Modeling Made Functional*:** o princípio **\"make illegal states unrepresentable\"** (tornar estados ilegais impossíveis de representar). Procure por esse termo e por *discriminated unions / choice types*.\n- **Horrocks, *Constructing the User Interface with Statecharts*:** por que a interface vira bagunça sem estados explícitos. Procure por *statecharts*, *concurrent states*, *transitions and guards*.\n- **Harel, \"Statecharts: A Visual Formalism for Complex Systems\" (1987):** o artigo original que o livro de Horrocks populariza (é um paper, não um livro).\n\n---\n\n### 2.2 Escrita parcial (falta de transação)\n\n**O que é.** Uma operação lógica (\"criar a semana\") são, no código, dezenas de `INSERT` em sequência. Se algo falha no meio, sobra uma semana pela metade, e o próximo acesso lê esse lixo como se fosse válido.\n\n**Caso real.** `getOrCreateWeeklySchedule` inseria o cronograma, depois 7 posts, depois 35 lâminas, tudo em `await` solto. Fora a atomicidade, havia a corrida *check-then-act*: duas requisições simultâneas olhavam \"existe?\", ambas viam \"não\", e ambas tentavam criar o mesmo id.\n\n**A cura.** [`schedule-service.ts`](../src/server/services/schedules/schedule-service.ts): `db.transaction(...)` (tudo ou nada) mais `onConflictDoNothing()` (a segunda requisição converge para o mesmo resultado em vez de falhar).\n\n> [!WARNING]\n> **Pegadinha que me custou tempo:** o `db.transaction` do `bun:sqlite` é **síncrono**. Dentro dele não se usa `await`; usa-se `.run()`, `.all()` e `.get()`. Se você escrever `await` lá dentro, o código parece certo e a transação já terminou.\n\n**Como treinar o olho.** Procure `for (...) { await db.insert(...) }`. Pergunte: *\"se o processo morrer na iteração 4, o que fica?\"*\n\n📚 **Onde aprofundar**\n- **Kleppmann, *Designing Data-Intensive Applications*:** o capítulo sobre **transações** (procure *ACID*, *atomicity*, *isolation levels*, *write skew*, *lost updates*). A corrida check-then-act aparece sob o nome de *write skew / phantoms*.\n\n---\n\n### 2.3 Duas fontes da verdade (banco ↔ disco ↔ tela)\n\n**O que é.** O mesmo fato mora em dois lugares e não existe nada que os mantenha iguais. Cedo ou tarde divergem.\n\n**Caso real.** A fila do AutoSocial é uma pasta (`pending/`, `published/`, `failed/`), e o status do post é uma coluna no SQLite. Quando o worker movia o arquivo para `published/`, o SQLite continuava dizendo `queued` **para sempre**. Pior: clicar duas vezes em \"enfileirar\" criava dois arquivos para o mesmo post.\n\n**Variantes que apareceram no mesmo projeto:**\n- Foto apagada no banco, mas o id continuava dentro do JSON `posts.selectedPhotoIds` (*referência pendurada*).\n- Excluir empresa apagava as linhas, mas deixava renders e uploads no disco (*lixo órfão*).\n- Upload gravava o arquivo e depois o `INSERT` falhava, deixando o arquivo sem dono.\n\n**A cura.** [`autosocial.ts`](../src/server/services/export/autosocial.ts):\n- **Idempotência:** enfileirar o mesmo post duas vezes dá o mesmo resultado (remove o anterior antes de gravar).\n- **Reconciliação:** `reconcileAutoSocialQueueWithDb` lê o disco e corrige o banco.\n- **Compensação:** se algo falha antes do commit, os arquivos já criados são removidos.\n- **Limpeza simétrica:** apagar no banco apaga no disco.\n\n**Como treinar o olho.** Para cada dado, pergunte *\"onde mais ele está guardado?\"*. Se a resposta for \"em dois lugares\", pergunte *\"qual é a verdade quando divergem, e quem corrige?\"*. Se ninguém corrige, é um bug esperando acontecer.\n\n📚 **Onde aprofundar**\n- **Kleppmann, DDIA:** o trecho sobre **manter sistemas sincronizados** (*dual writes*, *change data capture*, *event sourcing*) e o *end-to-end argument*. Procure **\"dual write\"**, o problema tem exatamente esse nome.\n- **Ford et al., *Software Architecture: The Hard Parts*:** coordenação entre vários recursos sem transação global (*sagas*, *eventual consistency*, *compensating transactions*).\n\n---\n\n### 2.4 Corridas e acoplamento temporal\n\n**O que é.** O código só funciona se as coisas acontecerem numa ordem, ou numa janela de tempo, que ninguém garante.\n\n**Casos reais:**\n- **Id temporário do cliente.** Lâminas novas nasciam com `id: \"temp_slide_...\"`. O \"Salvar\" fazia dois `PUT` seguidos, e o segundo tentava atualizar uma linha pelo id temporário, que não existe no banco. **O texto digitado sumia sem erro nenhum.** Cura: a chave natural `(postId, slideNumber)`, e os dois `PUT` viraram um só, atômico.\n- **Atualizar filho sem checar o pai.** `UPDATE ... WHERE id = ?` sem `AND post_id = ?`: com um id de outro post, a lâmina dele era alterada. Em sistema multi-empresa isso é vazamento entre clientes.\n- **Resposta que chega depois.** A IA responde 8 segundos depois, você já trocou de dia, e a resposta sobrescreve o post errado. Cura: toda resposta carrega o `postId` de origem e é descartada ou aplicada **por id**.\n- **Fuso horário.** `getDate()` (local) misturado com `toISOString()` (UTC) deslocava a segunda-feira da semana, dependendo da hora do dia. Estava copiado em 3 lugares, agora existe um só ([`calendar-dates.ts`](../src/shared/calendar-dates.ts)).\n\n**Como treinar o olho.** Pergunte *\"e se isso rodar duas vezes?\"*, *\"e se a resposta chegar depois que o contexto mudou?\"*, *\"esse id é estável, ou foi inventado pelo cliente?\"*.\n\n📚 **Onde aprofundar**\n- **Ousterhout, *A Philosophy of Software Design*:** **acoplamento temporal** e **\"define errors out of existence\"** (projetar para que o erro não possa acontecer, em vez de tratá-lo depois). O save atômico é um exemplo.\n- **Kleppmann, DDIA:** o capítulo sobre **problemas em sistemas distribuídos**, para o raciocínio sobre ordem e tempo (relógios, mensagens atrasadas).\n\n---\n\n### 2.5 Recurso sem teto\n\n**O que é.** Um `Map`, uma lista ou um cache que só cresce. Em desenvolvimento nunca aparece; em produção, semanas depois, a memória enche.\n\n**Caso real.** O limitador de tentativas de login (`session.ts`) e o de requisições por minuto (`quota-guard.ts`) guardavam uma entrada por IP/empresa e **nunca removiam**. Um atacante variando o IP enche a memória. Cura: [`bounded-ttl-map.ts`](../src/shared/state-machines/bounded-ttl-map.ts), com limite de entradas e expiração por tempo.\n\n**Parente próximo: o `catch {}` cego.** Em `db/client.ts`, um `catch {}` engolia **qualquer** erro de migração, inclusive os reais. Hoje só ignora os erros esperados (`duplicate column name`, `already exists`) e registra o resto.\n\n**Como treinar o olho.** Para cada coleção em memória: *\"qual é o tamanho máximo?\"*. Para cada `catch`: *\"que erros eu estou escondendo de propósito, e quais por acidente?\"*.\n\n📚 **Onde aprofundar**\n- **Nygard, *Release It!* (2ª ed.):** os padrões **Unbounded Result Sets**, **Steady State**, **Fail Fast**, **Timeouts**, **Circuit Breaker**, **Bulkheads**. Eles falam de sistemas que degradam devagar, sem cair.\n- **Johnsson, Deogun & Sawano, *Secure by Design*:** **domain primitives** e invariantes dentro do tipo (a ideia de que o valor inválido nem consegue ser construído).\n\n---\n\n## Parte 3 — As 7 máquinas de estado e as 16 falhas, em uma tabela de consulta\n\n| Item | Padrão (Parte 2) | Status |\n| :--- | :-: | :--- |\n| FSM #1 ciclo de vida do post | 2.1 | ✅ M12/M13 |\n| FSM #2 fila AutoSocial ↔ SQLite | 2.3 | ✅ M14 |\n| FSM #3 fluxo do Studio (7 booleans) | 2.1 | ✅ M15 |\n| FSM #4 boot de autenticação | 2.1 | ✅ M15 |\n| FSM #5 sessão Instagram (`expired`) | 2.1 | ✅ M12 |\n| FSM #6 modo operacional de IA (`executionMode`) | 2.1 | ⏳ **pendente** |\n| FSM #7 *dirty state* de formulários | 2.1 | 🟡 só no Studio; faltam `CompanyTab`, `WeekPlanner`, `SettingsHub` |\n| Bugs 1, 4, 6 (transação, lâminas fantasmas, TOCTOU) | 2.2 | ✅ M13 |\n| Bugs 2, 3 (dual-write, órfãos) | 2.3 | ✅ M14 |\n| Bugs 5, 12 (temp-id, filho sem escopo) | 2.4 | ✅ M13 |\n| Bugs 7, 8 (fuso, semana desconectada) | 2.4 | ✅ M12/M15 |\n| Bug 9 (preview Canvas ≠ PNG do servidor) | 2.3 | ⏳ **pendente** (`clientSlidePngs`) |\n| Bugs 11, 13 (referência pendurada, `timesUsed` morto) | 2.3 | ✅ M13 |\n| Bugs 15, 16 (mapas sem teto, `catch {}`) | 2.5 | ✅ M12/M13 |\n| Bugs 10, 14 (schema triplicado, `db` global) | — | ⏳ **não tratados** |\n\n> [!NOTE]\n> Os bugs **10** (definição de schema duplicada) e **14** (singleton `db` global) não entraram em nenhum marco. São dívida técnica registrada, não corrigida.\n\n---\n\n## Parte 4 — Exercícios práticos no próprio código\n\nCada exercício leva uns 15 a 30 minutos e treina um olhar específico.\n\n1. **Desenhe o diagrama de estados do post à mão** e compare com [`POST_STATUS_TRANSITIONS`](../src/shared/state-machines/post-lifecycle.machine.ts). Há alguma transição que você discordaria? (Ex.: `failed → queued` é \"tentar de novo\", faz sentido?)\n2. **Quebre a transação de propósito.** Em [`updatePostWithSlides`](../src/server/services/schedules/schedule-service.ts), lance um erro depois da poda de lâminas e rode o teste `integrity-m13.test.ts`. O que o teste diz? Isso mostra a diferença entre \"falhar\" e \"falhar sem deixar lixo\".\n3. **Reproduza a corrida da IA.** Imagine o `DesignStudioTab` antigo: dispare a geração, troque o dia, espere a resposta. Escreva em papel o que `updatedPosts[selectedDayIndex] = updatedPost` fazia.\n4. **Procure o próximo `catch {}`.** `grep -rn \"catch {}\" src/` e classifique cada um: *esperado* ou *acidental*?\n5. **Caça ao booleano.** `grep -rn \"useState<boolean>\\|useState(false)\" src/client` e agrupe por componente. Onde há 3 ou mais no mesmo fluxo, desenhe os estados reais. (Candidatos: `CompanyTab`, `SettingsHub`.)\n6. **Pergunte \"e se rodar duas vezes?\"** para cada rota `POST` em `src/server/routes/`. Quais são idempotentes? Quais criam duplicata?\n\n---\n\n## Parte 5 — Plano de leitura sugerido\n\nNão leia tudo. Ordene pelo que mais dói no seu projeto agora.\n\n| Ordem | Livro | Leia isto primeiro | Por quê agora |\n| :-: | :--- | :--- | :--- |\n| 1 | **Wlaschin**, *Domain Modeling Made Functional* | A parte sobre modelar com tipos e *illegal states* | Resolve a causa nº 1 e é a mais fácil de aplicar já |\n| 2 | **Horrocks**, *Statecharts* (e/ou o paper de Harel) | Estados concorrentes e guardas | Você ainda tem formulários sem *dirty state* |\n| 3 | **Kleppmann**, *DDIA* | Transações; manter sistemas sincronizados | É a base de M13 e M14 |\n| 4 | **Nygard**, *Release It!* | Padrões de estabilidade | Para quando o painel rodar 24/7 em home server |\n| 5 | **Ousterhout**, *A Philosophy of Software Design* | Complexidade; \"define errors out of existence\" | Melhora o design de cada módulo novo |\n| 6 | **Secure by Design** | *Domain primitives*; validação no domínio | Multi-tenant e credenciais do Instagram |\n| 7 | **Ford et al.**, *The Hard Parts* | Sagas e consistência eventual | Só se o sistema for dividido em serviços |\n\n**Ritmo sugerido:** 1 livro a cada 2 ou 3 semanas, lendo só o trecho indicado. Aplique no código **antes** de passar ao próximo.\n\n---\n\n## Parte 6 — Glossário rápido\n\n| Termo | Em uma frase |\n| :--- | :--- |\n| **FSM** | Máquina de estados finitos: estados + transições permitidas. |\n| **Guard** | Condição que decide se uma transição pode acontecer. |\n| **Boolean soup** | Vários booleans soltos fingindo ser uma máquina de estados. |\n| **ACID** | Atomicidade, Consistência, Isolamento, Durabilidade: as garantias de uma transação. |\n| **TOCTOU** | *Time-of-check to time-of-use*: checar e agir em momentos diferentes. |\n| **Idempotente** | Executar uma, duas ou dez vezes dá o mesmo resultado. |\n| **Dual-write** | Escrever o mesmo fato em dois lugares sem garantia de que ambos terminam. |\n| **Reconciliação** | Rotina que compara duas fontes e corrige a que está errada. |\n| **Compensação** | Desfazer manualmente o que já foi feito quando um passo seguinte falha. |\n| **Chave natural** | Identificador que vem do próprio domínio (`postId + slideNumber`), não inventado pelo cliente. |\n| **Bounded map** | Mapa com tamanho máximo e expiração. |\n| **Domain primitive** | Tipo pequeno que só aceita valores válidos. |\n\n---\n\n## Parte 7 — Os cinco hábitos para levar para qualquer projeto\n\n1. **Desenhe o estado antes de escrever o `if`.** Se dá para desenhar, vira união discriminada; se não dá, ainda não está entendido.\n2. **Para cada escrita, pergunte \"e se parar aqui?\"**\n3. **Para cada dado, pergunte \"onde mais ele mora?\"**\n4. **Para cada ação, pergunte \"e se rodar duas vezes, ou chegar atrasada?\"**\n5. **Para cada coleção, pergunte \"qual é o teto?\"**\n\n> [!TIP]\n> Esses cinco hábitos viram uma revisão de código de 5 minutos. Faça-os em voz alta na próxima vez que revisar um PR, seu ou de outra pessoa.\n", "docs/plans/checklist-marcos-m8-a-m15": "# 📋 Checklist Mestre de Desenvolvimento por Etapas (Marcos M8 a M11)\n\n> **Contrato Base:** [AGENTS.md](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/AGENTS.md) & [relatorio-completo-engenharia-e-plano-negocio.md](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/docs/relatorio-completo-engenharia-e-plano-negocio.md)  \n> **Metodologia Obrigatória em Cada Ticket:** `Plan-First` ➔ `Why-First` ➔ `TDD (Red -> Green)` ➔ `Safe-Refactor` ➔ `UI Craft Triad` ➔ `Commit Semântico Atômico` ➔ `Checkpoint HITL entre Marcos`.\n\n> [!IMPORTANT]\n> **⚖️ CLÁUSULA PÉTREA DE GOVERNANÇA (PERGUNTAR SEMPRE ETAPA POR ETAPA):**\n> 1. É terminantemente proibido avançar de uma etapa para a próxima sem **perguntar antes e receber confirmação explícita do usuário**.\n> 2. Ao término de cada etapa, este documento e o relatório técnico devem ser **atualizados com o registro exato de todas as modificações feitas** (arquivos alterados, testes criados, resultados de validação e commits).\n\n---\n\n## ✅ Etapa de Desenvolvimento 1 — Marco M8: Hardening de Segurança, Correções Críticas & Login Local (Home Server) [CONCLUÍDO]\n\n*Objetivo: Eliminar os 3 riscos críticos de segurança (`SEC-01`, `SEC-02`, `SEC-03`), corrigir o bug de diretório da fila do AutoSocial (`ENG-01`) e proteger o acesso ao painel no seu servidor doméstico com Login simples.*\n\n- [x] **Ticket M8-T1 (TDD — Correção `SEC-02`, `SEC-04`, `SEC-08` & `SEC-09` em Settings e Static Files):**\n  - Criado teste unitário em [`tests/server/settings-api.test.ts`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/tests/server/settings-api.test.ts#L161-L205) garantindo que `PUT /api/settings/app` nunca retorne `instagramSessionId`, `instagramCookiesJson` ou `imageProviderApiKey` em texto aberto, além de bloquear path traversal em `companyId`.\n  - Extraída função [`sanitizeCompanySettings()`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/settings.ts#L20-L34) e [`isValidCompanyId()`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/settings.ts#L12-L14) em [`src/server/routes/settings.ts`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/routes/settings.ts), aplicada permissão `mode: 0o600` nos arquivos `cookies.json`/`storageState.json` (`SEC-09`), adicionado `Content-Security-Policy` restritivo em `/renders/*.svg` (`SEC-08`) e travado path traversal no servimento de `dist/` em [`src/server/index.ts`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/index.ts#L118-L135).\n- [x] **Ticket M8-T2 (TDD — Correção `SEC-03`, `SEC-05`, `SEC-06` e `SEC-07` nos Provedores de IA e Uploads):**\n  - Criado validador anti-SSRF [`assertSafeOutboundUrl(rawUrl, provider)`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/ai/provider.ts#L80-L121) bloqueando varredura de IPs privados da LAN (`192.168.*`, `10.*`, `169.254.*`, `127.*`) para provedores remotos (`gemini`, `openai`, `claude`, `openrouter`).\n  - Movida a chave do [`GeminiProvider`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/ai/gemini.ts#L14-L28) da query string `?key=` para o header `x-goog-api-key` (`SEC-06`) e adicionado `AbortSignal.timeout()` em todos os adapters de texto (`SEC-07`: [`gemini.ts`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/ai/gemini.ts), [`openai.ts`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/ai/openai.ts), [`claude.ts`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src/server/services/ai/claude.ts), [`mlstudio.ts`](file:///home/eduardorwll/Projects/Sandbox/src/insta-auto-panel/src
